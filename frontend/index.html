<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSID-EMS Admin</title><link rel="preload" href="/health" as="fetch"><link rel="preload" href="/api/health" as="fetch">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2e;--line:#24344d;--text:#e5edf8;--muted:#91a4bd;--accent:#5eead4}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:24px 16px;border-right:1px solid var(--line);background:#0d1728}.brand{font-weight:800;font-size:20px;margin:0 10px 28px}.group{margin:20px 0 8px 10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.nav a{display:block;padding:9px 10px;border-radius:8px;color:#bdcbe0}.nav a:hover,.nav a.active{background:#19304a;color:var(--accent)}main{padding:32px;max-width:1200px;width:100%}.crumbs{color:var(--muted);font-size:13px;margin-bottom:28px}.crumbs a{color:var(--accent)}h1{font-size:34px;margin:0 0 8px}.lede{color:var(--muted);margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-height:140px}.card h2{font-size:17px;margin:0 0 12px}.status{color:var(--accent);font-weight:700}.note{color:var(--muted);line-height:1.5}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.group{grid-column:1/-1}}
</style>
</head>
<body><div class="layout"><aside class="side"><div class="brand">SSID-EMS</div><span hidden>SSID-EMS Frontend</span><nav class="nav" aria-label="Admin navigation" data-route-count="22"><!-- NAVIGATION_REGISTRY --></nav></aside><main><div class="crumbs" id="breadcrumbs" aria-label="Breadcrumb"></div><section id="app"></section></main></div>
<script>
function text(tag, value, className){const node=document.createElement(tag);node.textContent=value;if(className)node.className=className;return node}
function renderRoute(){const path=location.pathname;const item=document.querySelector(`[data-route="${CSS.escape(path)}"]`);const label=item?item.textContent:'Admin surface';const parts=path.split('/').filter(Boolean);const crumbs=document.querySelector('#breadcrumbs');crumbs.replaceChildren();const home=document.createElement('a');home.href='/console';home.textContent='console';crumbs.append(home);parts.forEach((part,i)=>{crumbs.append(document.createTextNode(' / '),text('span',i===parts.length-1?label:part.replaceAll('-',' ')))});document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===path));const app=document.querySelector('#app');app.replaceChildren();const grid=document.createElement('div');grid.className='grid';const card=document.createElement('article');card.className='card';card.append(text('h2','Route restored'),text('p','Available','status'),text('p','This static surface provides navigation only. Backend APIs remain authoritative for authentication, authorization, and operational data.','note'));const current=document.createElement('article');current.className='card';current.append(text('h2','Current route'));const code=document.createElement('code');code.textContent=path;current.append(text('p',''),code,text('p','No privileged data is fabricated in the frontend.','note'));grid.append(card,current);app.append(text('h1',label),text('p','Canonical SSID-EMS administrative workspace','lede'),grid)}
window.addEventListener('popstate',renderRoute);document.querySelectorAll('[data-route]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();history.pushState({},'',a.href);renderRoute()}));renderRoute();
</script></body></html>
