<!doctype html>
<html lang="en">
  <head>

    <title>SSID-EMS Frontend</title>
    <style>

      body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; padding: 32px; background: #0f172a; color: #e2e8f0; }

  <body>
